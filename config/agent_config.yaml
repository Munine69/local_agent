rtsp:
  # ipTIME C500G (192.168.0.75:554)
  # 카메라 펌웨어가 광고하는 /stream_ch0 path는 SETUP을 거부한다.
  # ONVIF GetStreamUri로 발급받은 path만 SETUP을 통과한다.
  #   MainStream(2880x1620): /onvif1
  #   SubStream(640x368):    /onvif2
  # 실제 ID/PW 포함 URL은 .env의 RTSP_URL에 둔다.
  # 자격/path 갱신은 scripts/probe_onvif.py 로 다시 확인 가능.
  url: "${RTSP_URL}"
  buffer_size: 30
  reconnect_backoff_sec: 2.0
  max_reconnect_attempts: 10

quality:
  blur_threshold: 100.0
  brightness_min: 50
  brightness_max: 230
  glare_max_ratio: 0.15
  quality_fail_cooldown_sec: 5.0

capture:
  timer_seconds: 3
  bestshot_weights:
    sharpness: 0.5
    brightness: 0.3
    contrast: 0.2

ocr:
  provider: "gemini_ocr"      # gemini_ocr | stub
  save_dir: "runtime/ocr"
  gemini_model: "gemini-3-flash-preview"
  gemini_fallback_models:
    - "gemini-2.5-flash"
    - "gemini-flash-latest"
  gemini_api_key: ""
  gemini_api_key_env: "GEMINI_API_KEY"
  gemini_prompt: |
    이 이미지는 병원 진료비 세부내역서 또는 처방전/약봉투입니다.
    표 형식으로 되어 있는 모든 항목(코드, 명칭, 금액, 약품명, 용법, 투약일수 등)을
    가능한 한 누락 없이 한국어 텍스트로 추출해 주세요.
    흐릿해서 확실하지 않은 글자는 추측하지 말고 [불명확]으로 표시해 주세요.
    표 구조는 Markdown 표로 유지해 주세요.
  confidence_threshold: 0.85
  fuzzy_match_max_distance: 2
  medical_dict_path: "config/medical_terms.json"

cloud:
  enabled: true
  endpoint: "${ODISS_CLOUD_URL:-http://localhost:8000}"
  speaker_id: "${ODISS_SPEAKER_ID:-jetson_live}"
  drug_parser_path: "/api/ocr/analyze"
  instruction_log_path: "/api/stt/log"
  websocket_path: "/ws/chat"
  timeout_sec: 10.0
  websocket_timeout_sec: 120.0
  websocket_first_response_timeout_sec: 8.0
  retry_count: 3
  retry_backoff_sec: 1.0

wait_ux:
  waiting_escalation_intervals_sec: [3, 7, 15]

audio:
  # Jabra SPEAK 510 USB (lsusb: 0b0e:0422). 카드 번호는 재부팅마다 바뀔 수 있어 CARD=이름으로 고정.
  # aplay -l 로 확인: card 0 [Jabra SPEAK 510 USB] → plughw:CARD=USB,DEV=0 또는 plughw:0,0
  output_device: "${ODISS_AUDIO_OUTPUT:-plughw:CARD=USB,DEV=0}"
  input_device: "${ODISS_AUDIO_INPUT:-plughw:CARD=USB,DEV=0}"
  sample_rate: 22050   # speaker 출력 샘플레이트
  channels: 1
  capture_shutter_path: "runtime/audio/camera_shutter.wav"

tts:
  # 실제 음성 합성 여부. false면 StubTTS (로그만)
  enabled: true
  engine: "gtts"   # gtts | stub
  lang: "ko"
  tld: "co.kr"     # 한국어 발음/억양 안정. 다른 옵션: com / com.au
  slow: false
  sample_rate: 22050
  channels: 1

stt:
  # 실제 마이크 + Whisper 사용 여부. false면 StubVAD/StubSTT 사용
  enabled: true
  input_device: "${ODISS_AUDIO_INPUT:-plughw:CARD=USB,DEV=0}"
  sample_rate: 16000           # webrtcvad/whisper 표준
  frame_ms: 30                 # 10/20/30 만 허용
  vad_aggressiveness: 2        # 3은 사용자 발화 누락↑ — 대화 중 2 권장
  silence_tail_ms: 450         # 짧은 호출어 종료 감지 지연을 줄임
  min_utterance_ms: 250
  max_utterance_ms: 8000       # TV/방송 소리 12초 연속 캡처 방지
  whisper_backend: "gemini_stt" # gemini_stt | openai_whisper | faster_whisper
  gemini_stt_model: "gemini-2.5-flash"
  gemini_api_key: ""
  gemini_api_key_env: "GEMINI_API_KEY"
  gemini_stt_prompt: |
    이 오디오는 한국어 음성입니다.
    들리는 발화만 그대로 전사하세요.
    추측하거나 문장을 보완하지 마세요.
    음성이 없거나 불명확하면 빈 문자열만 반환하세요.
  whisper_model: "medium"      # openai_whisper/faster_whisper fallback
  whisper_compute_type: "float16"
  whisper_device: "cuda"
  language: "ko"
  initial_prompt: "오디스 오디스야"
  wake_focus_prompt: "오디스 오디스야"
  wake_focus_scan_enabled: true
  wake_focus_scan_min_duration_sec: 0.8
  wake_focus_tail_sec: 1.2
  wake_focus_head_sec: 1.0
  wake_rolling_scan_enabled: true
  wake_rolling_scan_interval_ms: 500
  wake_rolling_scan_min_speech_ms: 600
  wake_fast_path_enabled: true
  wake_fast_path_max_duration_sec: 1.8
  wake_stt_backend: "faster_whisper" # wake-only는 로컬 tiny 모델로 먼저 확인해 Gemini 왕복을 피함
  wake_whisper_model: "tiny"
  wake_whisper_compute_type: "int8"
  wake_whisper_device: "${ODISS_WAKE_WHISPER_DEVICE:-cpu}"
  discard_non_wake_background: true
  duplicate_turn_ttl_sec: 4
  repeat_tts_suppress_sec: 60
  generic_repeat_tts_suppress_sec: 8
  post_tts_listen_grace_sec: 0.6   # 서버 TTS 직후 마이크 준비 시간 (스피커 잔향)
  dialogue_session_timeout_sec: 300
  followup_listen_timeout_sec: 300
  question_wait_timeout_sec: 35
  max_empty_stt_skips: 24

latency_trace:
  enabled: true
  output_path: "${LATENCY_TRACE_PATH:-runtime/latency_trace.jsonl}"

turboquant:
  auto_wrap: true
  key_bits: 3
  value_bits: 3
  compress_values: false
  require_cuda: false
